name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Verify release version
        run: |
          package_version="$(nix develop --command jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version v$package_version"
            exit 1
          fi

      - name: Install VS Code packaging dependencies
        run: nix develop --command npm ci

      - name: Check and package themes
        run: nix develop --command npm run package:vscode

      - name: Bundle generated themes
        run: |
          nix develop --command zip -j "dark-fire-vscode-themes-${GITHUB_REF_NAME}.zip" themes/vscode/*
          nix develop --command zip -j "dark-fire-ghostty-themes-${GITHUB_REF_NAME}.zip" themes/ghostty/*
          nix develop --command zip -j "dark-fire-web-themes-${GITHUB_REF_NAME}.zip" themes/web/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dark-fire-*.vsix \
            "dark-fire-vscode-themes-${GITHUB_REF_NAME}.zip" \
            "dark-fire-ghostty-themes-${GITHUB_REF_NAME}.zip" \
            "dark-fire-web-themes-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --generate-notes \
            --title "Dark Fire ${GITHUB_REF_NAME}"
